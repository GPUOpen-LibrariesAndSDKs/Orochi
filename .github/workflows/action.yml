name: Build
on: [push]
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: configure
      run: sudo apt-get install python3
    - name: chmod
      run: chmod +x ./tools/premake5/linux64/premake5
    - name: premake
      run: ./tools/premake5/linux64/premake5 gmake --builddir=build
    - name: make
      run: make -C build -j all
    - name: generate-test
      run: |
        p=./tools/premake5/linux64/premake5
        $p --builddir=build/gen/clang --clang --warning=extra --werror --sanitizer=address ninja
        $p --builddir=build/gen/bake --bakeKernel gmake
        $p --builddir=build/gen/win --os=windows vs2022
        test -f build/gen/win/YamatanoOrochi.sln
        ! $p --clang=foo gmake
